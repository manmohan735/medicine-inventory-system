<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>user</title>
    <style>
          h2{
        text-align:center;
    }

    form{
        width: 500px;
        margin:auto;

    }

    label{
        padding:10px;
        font-family: 'Franklin Gothic Medium', 'Arial Narrow', Arial, sans-serif;
        display:inline-block;

    }

    input{
        padding:8px;
        width:200px;
        margin-bottom:10px;



    }

    .btn{
        padding:10px 25px;
        cursor: pointer;

        

    }

    </style>

  

    </style>
</head>
<body>
    <h2>user form</h2>
    <form id="userform">

        <label for="fulname">Fullname:</label>
        <input type="text" id="fulname" name="fulname" required>

        <label for="uname">Username:</label>
        <input type="text" id="uname" name="uname" required>

        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="example@gmail.com" required><br><br>

        <label for="role">Role:</label>
        <select name="role" id="role" required>
            <option value="Admin">Admin</option>
            <option value="Pharmasist">Pharmasist</option>
            <option value="inspector">inspector</option>

        </select>

        <input type="submit" value="Submit" class="btn">
       

    </form> <br>

    <table border="1" id="user_table">
        <thread>
            <tr>
                <th>id</th>
                <th>name</th>
                <th>username</th>
                <th>role</th>
                <th>action</th>
            </tr>
        </thread>
        <tbody id="table_body">

        </tbody>

    </table>

    <script>
        let form=document.getElementById('userform');
        let tableBody=document.getElementById('table_body');

        let id=1;

        form.addEventListener('submit',function(event){
            event.preventDefault();

            let name=document.getElementById('fulname').value;
            let username=document.getElementById('uname').value;
            let role=document.getElementById('role').value;

            let row=tableBody.insertRow();

            row.insertCell(0).textContent=id;
            row.insertCell(1).textContent=name;
            row.insertCell(2).textContent=username;
            row.insertCell(3).textContent=role;

            let actionCell=row.insertCell(4);

            let deleteBtn=document.createElement('button');
            deleteBtn.textContent='Delete';

            deleteBtn.onclick=function(){
                row.remove();
            };

            actionCell.appendChild(deleteBtn);

            id++;

            form.reset();


        });
    </script>
    
</body>
</html>
